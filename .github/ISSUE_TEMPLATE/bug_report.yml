name: Сообщение об ошибке
description: Сообщить о проблеме при установке, сборке или использовании 1C-Nix.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что сообщаете о проблеме. Заполните, что знаете: неизвестные поля можно пропустить или написать «не знаю».

        Не прикладывайте дистрибутив 1С и собранный из него пакет — только текст ошибок, логи и скриншоты.

  - type: dropdown
    id: component
    attributes:
      label: Компонент
      description: Если непонятно, где именно проблема, выберите «Другое / Неизвестно».
      options:
        - Клиент 1С / Конфигуратор
        - Сервер 1С (ragent)
        - Сервер администрирования (RAS)
        - Установка и сборка пакета
        - Модуль NixOS
        - X11 / XWayland / графическое окружение
        - Другое / Неизвестно
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Окружение
      description: |
        Укажите то, что известно. Ревизия 1C-Nix — из `flake.lock` вашей конфигурации (`nix flake metadata`) или `git rev-parse HEAD` в клоне репозитория.
      placeholder: |
        ОС: NixOS 25.11
        Архитектура: x86_64-linux
        Версия Nix: 2.x
        Ревизия 1C-Nix: commit SHA или тег
        Версия 1С: 8.3.27.1508
        Дистрибутив 1С: учебный, .run
        Способ установки: NixOS module / nix build
    validations:
      required: true

  - type: textarea
    id: graphics
    attributes:
      label: Графическое окружение
      description: Нужно в основном для ошибок клиента и Конфигуратора. Для сервера можно пропустить.
      placeholder: |
        Сеанс: Wayland / XWayland / X11
        Окружение: Hyprland
        Версия: ...
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Описание проблемы
      description: Кратко — что именно не работает.
      placeholder: |
        Например: «Конфигуратор падает с SIGSEGV при открытии формы документа» или «1c-ragent перезапускается каждые 5 секунд после nixos-rebuild switch».
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. Установить 1C-Nix через ...
        2. Запустить ...
        3. Открыть ...
        4. Наблюдать ошибку ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
      description: Что должно происходить, если всё работает правильно.
      placeholder: "Например: форма открывается, окно перерисовывается после разворачивания."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: "Что происходит вместо этого: сообщение об ошибке, зависание, падение, неверный результат."
      placeholder: "Например: окно остаётся серым, процесс 1cv8 висит, пока его не завершить через kill."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Логи и сообщения об ошибках
      description: |
        Вставьте относящуюся к делу часть вывода, например из `nix build -L`, `nix flake check -L`, `journalctl -u 1c-ragent -u 1c-ras`, stdout/stderr программы или логов клиента. Все команды запускать не нужно.

        Чтобы текст не исказился, оберните его в тройные обратные кавычки (`` ``` ``) — строкой до и строкой после.
    validations:
      required: false

  - type: textarea
    id: workarounds
    attributes:
      label: Что уже пробовали
      description: |
        Перечислите, что уже сделали и чем это закончилось. Например:
        - проблема с окнами клиента — воспроизводится ли с `ONEC_NO_X11_FIXES=1 1cv8c` (запуск без X11-фиксов);
        - не хватает библиотеки — вывод `onec-shell -c 'ldd /opt/1cv8/x86_64/*/1cv8c | grep "not found"'`;
        - проблема с `/opt` — повторяется ли с `services.onec.linkToOpt = false`.
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Дополнительная информация
      description: Скриншоты, особенности окружения, ссылки на связанные Issues.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Подтверждения
      options:
        - label: Я ознакомился с документацией и проверил, что аналогичная проблема ещё не была зарегистрирована.
          required: false
        - label: Я убедился, что сообщение не содержит паролей, лицензионных ключей, конфиденциальных данных и проприетарных дистрибутивов 1С.
          required: true
