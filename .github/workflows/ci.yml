# CI гоняет проверки на ФАЛЬШИВЫХ дистрибутивах (tests/default.nix).
# Настоящий дистрибутив 1С в CI не нужен и класть его туда нельзя.
name: checks

# push — только в master: ветки PR проверяет pull_request, без двойного прогона.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  flake-check:
    # ubuntu-latest переходит на 26.04; настройки AppArmor ниже проверены
    # на 24.04 — версию поднимать отдельно.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Ubuntu 24.04 по умолчанию запрещает непривилегированные user
      # namespaces, а распаковка и FHS-окружение работают через bubblewrap.
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: nix flake check
        run: nix flake check --print-build-logs

  # NixOS-тест модуля в QEMU (packages.module-vm-test): без KVM он идёт
  # на порядки медленнее, поэтому KVM включаем явно и проверяем.
  nixos-vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          test -w /dev/kvm

      - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm

      - name: NixOS VM test
        timeout-minutes: 30
        run: nix build .#module-vm-test --print-build-logs
